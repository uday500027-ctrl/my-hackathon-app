<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="A document with sensitive text masked by black bars">
  <!-- Warm off-white background paper -->
  <rect width="480" height="360" fill="#f7f5f2" rx="4"/>

  <!-- Paper sheet -->
  <rect x="60" y="32" width="360" height="296" rx="6" fill="#faf9f7" stroke="#e0ddd9" stroke-width="1"/>

  <!-- Page fold corner -->
  <path d="M380 32 L420 32 L420 72 Z" fill="#f0ede9" stroke="#e0ddd9" stroke-width="1"/>

  <!-- Text lines - top section -->
  <line x1="88" y1="80" x2="320" y2="80" stroke="#c9c5be" stroke-width="1.4"/>
  <line x1="88" y1="100" x2="360" y2="100" stroke="#c9c5be" stroke-width="1.4"/>

  <!-- BLACK BAR over part of line 3 -->
  <rect x="88" y="118" width="120" height="11" rx="1.5" fill="#1a1a18"/>
  <line x1="218" y1="122" x2="340" y2="122" stroke="#c9c5be" stroke-width="1.4"/>

  <!-- Text lines -->
  <line x1="88" y1="142" x2="290" y2="142" stroke="#c9c5be" stroke-width="1.4"/>

  <!-- Forest-green accent line (thin) -->
  <line x1="88" y1="158" x2="392" y2="158" stroke="#3a6b47" stroke-width="1.2"/>

  <!-- Text line -->
  <line x1="88" y1="178" x2="340" y2="178" stroke="#c9c5be" stroke-width="1.4"/>

  <!-- BLACK BAR over line 6, middle section -->
  <rect x="140" y="194" width="160" height="11" rx="1.5" fill="#1a1a18"/>
  <line x1="88" y1="198" x2="132" y2="198" stroke="#c9c5be" stroke-width="1.4"/>
  <line x1="308" y1="198" x2="380" y2="198" stroke="#c9c5be" stroke-width="1.4"/>

  <!-- Text lines -->
  <line x1="88" y1="218" x2="360" y2="218" stroke="#c9c5be" stroke-width="1.4"/>
  <line x1="88" y1="238" x2="280" y2="238" stroke="#c9c5be" stroke-width="1.4"/>

  <!-- BLACK BAR at start of line 9 -->
  <rect x="88" y="254" width="90" height="11" rx="1.5" fill="#1a1a18"/>
  <line x1="186" y1="258" x2="350" y2="258" stroke="#c9c5be" stroke-width="1.4"/>

  <!-- Final text line -->
  <line x1="88" y1="278" x2="300" y2="278" stroke="#c9c5be" stroke-width="1.4"/>
</svg>
